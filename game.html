<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess the pitch — Pitch Predict</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="site-nav" aria-label="Site">
    <a href="index.html">Live at-bats</a>
    <span class="site-nav-sep" aria-hidden="true">·</span>
    <span class="site-nav-current">Guess the pitch</span>
  </nav>

  <header class="game-header">
    <h1 id="game-title">Guess the pitch</h1>
    <div class="game-mode" role="group" aria-label="Game mode">
      <a href="game.html" id="mode-daily" class="game-mode-btn">Daily</a>
      <a href="game.html?mode=free" id="mode-free" class="game-mode-btn">Free play</a>
    </div>
    <p id="meta" class="game-meta">Loading today’s challenge…</p>
  </header>

  <section id="game-score" class="game-score" aria-label="Accuracy">
    <div class="game-score-card">
      <div class="lbl">You</div>
      <div class="val" id="you-acc">—</div>
      <div class="sub" id="you-sub">0 / 0</div>
    </div>
    <div class="game-score-card">
      <div class="lbl">Model</div>
      <div class="val" id="model-acc">—</div>
      <div class="sub" id="model-sub">0 / 0</div>
    </div>
  </section>
  <script>
    if (new URLSearchParams(location.search).get("mode") !== "free") {
      document.getElementById("game-score")?.setAttribute("hidden", "");
      document.body.classList.add("daily-mode");
    }
  </script>

  <div id="daily-grid" class="daily-grid" hidden aria-label="Daily progress"></div>

  <div id="board" class="game-board" aria-live="polite"></div>

  <div class="game-actions">
    <button type="button" id="next-ab" class="game-btn" hidden>Next at-bat</button>
    <button type="button" id="skip" class="game-btn game-btn-ghost" hidden>Skip at-bat</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
